<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#0a0a0f"/>
  
  <!-- Grid lines (subtle) -->
  <g stroke="#00ffaa" stroke-width="0.5" opacity="0.1">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
  </g>
  
  <!-- T-piece (center, magenta) -->
  <g filter="url(#glow-strong)">
    <rect x="192" y="192" width="64" height="64" fill="#ff00ff" stroke="#ff00ff" stroke-width="2"/>
    <rect x="256" y="192" width="64" height="64" fill="#ff00ff" stroke="#ff00ff" stroke-width="2"/>
    <rect x="320" y="192" width="64" height="64" fill="#ff00ff" stroke="#ff00ff" stroke-width="2"/>
    <rect x="256" y="256" width="64" height="64" fill="#ff00ff" stroke="#ff00ff" stroke-width="2"/>
  </g>
  
  <!-- I-piece (bottom, cyan) -->
  <g filter="url(#glow)">
    <rect x="128" y="384" width="64" height="64" fill="#00ffff" stroke="#00ffff" stroke-width="2" opacity="0.8"/>
    <rect x="192" y="384" width="64" height="64" fill="#00ffff" stroke="#00ffff" stroke-width="2" opacity="0.8"/>
    <rect x="256" y="384" width="64" height="64" fill="#00ffff" stroke="#00ffff" stroke-width="2" opacity="0.8"/>
    <rect x="320" y="384" width="64" height="64" fill="#00ffff" stroke="#00ffff" stroke-width="2" opacity="0.8"/>
  </g>
  
  <!-- L-piece (left, orange) -->
  <g filter="url(#glow)">
    <rect x="64" y="192" width="64" height="64" fill="#ff6600" stroke="#ff6600" stroke-width="2" opacity="0.7"/>
    <rect x="64" y="256" width="64" height="64" fill="#ff6600" stroke="#ff6600" stroke-width="2" opacity="0.7"/>
    <rect x="64" y="320" width="64" height="64" fill="#ff6600" stroke="#ff6600" stroke-width="2" opacity="0.7"/>
    <rect x="128" y="320" width="64" height="64" fill="#ff6600" stroke="#ff6600" stroke-width="2" opacity="0.7"/>
  </g>
  
  <!-- Z-piece (right, red) -->
  <g filter="url(#glow)">
    <rect x="384" y="256" width="64" height="64" fill="#ff0000" stroke="#ff0000" stroke-width="2" opacity="0.7"/>
    <rect x="384" y="320" width="64" height="64" fill="#ff0000" stroke="#ff0000" stroke-width="2" opacity="0.7"/>
    <rect x="320" y="320" width="64" height="64" fill="#ff0000" stroke="#ff0000" stroke-width="2" opacity="0.7"/>
    <rect x="320" y="384" width="64" height="64" fill="#ff0000" stroke="#ff0000" stroke-width="2" opacity="0.7"/>
  </g>
  
  <!-- Text -->
  <text x="256" y="128" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" fill="#00ffaa" text-anchor="middle" filter="url(#glow-strong)">NEON</text>
  <text x="256" y="168" font-family="Arial Black, sans-serif" font-size="36" font-weight="900" fill="#00ffaa" text-anchor="middle" filter="url(#glow)">TETRIS</text>
</svg>
